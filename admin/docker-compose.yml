# Admin panel stack. Runs separately from the media stack in /opt/aivoice so a
# panel rebuild can never bounce Asterisk / LiveKit / the agents - it only joins
# their network to reach postgres.
#
#   cd /srv/aivoice && docker compose -f admin/docker-compose.yml up -d --build
#
# Reads admin/.env (gitignored). See admin/.env.example.

services:
  admin-api:
    build: ./backend
    container_name: admin-api
    restart: unless-stopped
    env_file: .env
    volumes:
      # The agent's kb.py is mounted, not copied. One implementation of
      # extraction and chunking - two would drift and retrieval quality would
      # differ by which route ingested a document, with nothing to say so.
      - ../agent:/app/kblib:ro
      # Uploaded PDFs, kept so a document can be re-ingested without asking the
      # client for the file again.
      - kb-files:/data/kb
      # Call recordings, written by Asterisk in the other compose project.
      # Read-only: the panel serves them, it has no business changing them.
      - recordings:/data/recordings:ro
    ports:
      # Bound to localhost. Reach it through the nginx container, or an SSH
      # tunnel during development - never publish the API to the LAN directly.
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

  admin-web:
    build: ./frontend
    container_name: admin-web
    restart: unless-stopped
    depends_on: [ admin-api ]
    ports:
      # This one IS reachable from the LAN - it is the panel. Keep the firewall
      # rule source-restricted until there is TLS in front of it.
      - "8080:80"
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

volumes:
  kb-files:
  # Created by the media stack in /opt/aivoice. Declared external so this
  # project attaches to it rather than making a second, empty one.
  recordings:
    name: aivoice_recordings
    external: true

networks:
  default:
    name: aivoice_default
    external: true
