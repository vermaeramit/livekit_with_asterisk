server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The panel and the API are served from the same origin, so the browser
    # never makes a cross-origin request and CORS stays out of the picture.
    location /api/ {
        proxy_pass         http://admin-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Knowledge-base uploads. nginx defaults to 1 MB and rejects anything
        # larger with an HTML error page - no JSON body, so the console could
        # only report a bare "413". Set slightly above the application's own
        # 30 MB limit so the readable message is the one that reaches the user.
        client_max_body_size 32m;

        # Ingestion is synchronous: extraction, chunking and embedding all
        # happen before the response. 60s cut off long documents mid-embed.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # hashed filenames, so they can be cached indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached or a deploy leaves clients on old assets
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # client-side routing: unknown paths are React routes, not 404s
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
