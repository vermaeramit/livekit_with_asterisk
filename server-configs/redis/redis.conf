# Deployed at /opt/aivoice/redis/redis.conf

bind 127.0.0.1
port 6379
protected-mode yes

# Persistence ON. It was off here, with the note "this is LiveKit coordination
# state, not durable data". That was wrong: the SIP inbound trunk and dispatch
# rule live in Redis too, and they are configuration, not coordination. A reboot
# wiped both - every call then rang and died with SIP 486, and nothing in the
# agent, LiveKit or Asterisk logs said why, because the call was rejected before
# any rule lookup happened.
#
# The original worry - disk I/O adding jitter to real-time audio - still stands,
# so this is RDB rather than AOF: a snapshot at most once a minute, and only
# when something actually changed. The dataset is a handful of keys.
save 60 1
appendonly no
dir /data

maxmemory 256mb
# NOT allkeys-lru, which was set here before. Under memory pressure that policy
# is free to evict any key - including the SIP trunk and dispatch rule. The same
# outage as above, but mid-production and with no reboot to blame it on. Failing
# a write loudly is the better outcome for config we cannot afford to lose.
maxmemory-policy noeviction
