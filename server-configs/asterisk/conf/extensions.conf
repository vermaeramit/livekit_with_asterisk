[general]
static=yes
writeprotect=no

[from-internal]

; 600 -> Echo test (Asterisk ka apna echo)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 -> Playback test
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; 700 -> LiveKit room mein bhejo
;
; 8s timeout, not 30s. livekit-sip does not answer until an agent subscribes to
; its track, so if the worker is down the caller just hears ringing until the
; Dial gives up. One crashed worker would stall the whole dialer.
; On timeout, fall through to the same human extension the agent transfers to.
exten => 700,1,NoOp(--> Routing to LiveKit AI)
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/700@livekit,25)
 same => n,NoOp(--> AI UNAVAILABLE - falling back to human  DIALSTATUS=${DIALSTATUS})
 same => n,Goto(from-livekit,800,1)
 same => n,Hangup()

; 702 -> latency test: rx/tx alag record karke LiveKit bhejo
exten => 702,1,NoOp(--> LATENCY TEST)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MixMonitor(lat.wav,r(/var/spool/asterisk/monitor/lat-in.wav)t(/var/spool/asterisk/monitor/lat-out.wav))
 same => n,Dial(PJSIP/700@livekit,30)
 same => n,StopMixMonitor()
 same => n,Hangup()

; 1001 -> softphone ko wapas call
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()


[from-livekit]

; 800 -> transfer target. livekit-sip sends a SIP REFER here when the agent
; calls transfer_to_human(). This must come BEFORE the _. catch-all, which
; would otherwise match and hang up the transfer.
;
; In production this becomes Dial(PJSIP/1002) or Queue(support). For now it is
; a stand-in so the caller can hear that the transfer actually landed.
exten => 800,1,NoOp(<-- TRANSFER landed: human agent)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-thanks)
 same => n,Echo()
 same => n,Hangup()

exten => _.,1,NoOp(<-- Inbound from LiveKit: ${EXTEN})
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Load test. Originated as Local/s@loadtest and bridged to 700, so the LiveKit
; side receives real speech and the full STT -> LLM -> TTS path runs. Silence
; would only exercise the transport and tell us nothing about capacity.
; ---------------------------------------------------------------------------
[loadtest]
exten => s,1,Answer()
 same => n,Set(i=0)
 same => n,Wait(2)
 same => n(loop),Playback(demo-thanks)
 same => n,Wait(7)
 same => n,Set(i=$[${i}+1])
 same => n,GotoIf($[${i} < ${IF($[${LOADTEST_TURNS}foo = foo]?8:${LOADTEST_TURNS})}]?loop)
 same => n,Hangup()
