[general]
static=yes
writeprotect=no

; Where a human handoff lands. Kept here rather than inline at 800 because it is
; the one thing in this file that changes when the dialler side changes, and it
; should be editable without reading the transfer logic.
;
; The agent transfers by SIP REFER to sip:800@10.130.9.243 (campaign config,
; `transfer_to`). REFER can only carry a SIP URI - that is the protocol, not a
; choice. What Asterisk dials AFTER the REFER is a separate decision, and it is
; this one. Their side is IAX2, so the handoff is IAX2.
[globals]
HANDOFF_PEER=IAX2/243SERVER
; ⚠️ NOT SET YET - the dialler team has to say which extension or queue on their
; side should answer. Until it is filled in, 800 falls through to the "nobody
; answered" path, which is at least audible to the caller.
HANDOFF_EXTEN=

[from-internal]

; 600 -> Echo test (Asterisk ka apna echo)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 -> Playback test
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; 7XX -> LiveKit room mein bhejo
;
; A PATTERN, not a single extension. Which campaign serves a call is decided by
; campaign_routes in the database, so Asterisk only has to get the call to
; LiveKit - it should not need editing every time a number is added in the
; console. Adding 705 there and finding Asterisk answer "404 Not Found" is
; exactly the confusion this avoids.
;
; 702 keeps its own explicit entry below and still wins: Asterisk prefers an
; exact match over a pattern.
;
; 25s timeout. livekit-sip does not answer until an agent subscribes to its
; track, so if the worker is down the caller just hears ringing until the Dial
; gives up. One crashed worker would stall the whole dialer.
; On timeout, fall through to the same human extension the agent transfers to.
exten => _7XX,1,NoOp(--> Routing to LiveKit AI: ${EXTEN})
 ; The dialler sends per-call context as IAX2 variables: who is calling, what
 ; they bought, which lead this is. The agent uses them to greet the caller by
 ; name instead of asking who they are.
 ;
 ; Copied into channel variables with a SINGLE leading underscore, which is what
 ; makes them inherit into the outbound channel - the pre-dial handler cannot
 ; read IAXVAR(), because by then it is running on a PJSIP channel that never
 ; had them. Reading them here and inheriting is the only path.
 ;
 ; They were NoOp'd straight onto the console before this, which showed they
 ; arrive but sent them nowhere.
 same => n,Set(_X_CUS_NAME=${IAXVAR(cus_name)})
 same => n,Set(_X_CALLTYPE=${IAXVAR(calltype)})
 same => n,Set(_X_SR_ID=${IAXVAR(Sr_id)})
 same => n,Set(_X_LEAD_ID=${IAXVAR(dialerLeadid)})
 same => n,Set(_X_MODALNAME=${IAXVAR(Modalname)})
 same => n,Set(_X_CALL_UNIQUE=${IAXVAR(dialercallUnique)})
 same => n,Set(_X_LANGUAGE=${IAXVAR(language)})
 same => n,NoOp(--> dialler context: name=${X_CUS_NAME} lead=${X_LEAD_ID} model=${X_MODALNAME} lang=${X_LANGUAGE})
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/${EXTEN}@livekit,25,b(recsetup^s^1))
 same => n,NoOp(--> AI UNAVAILABLE - falling back to human  DIALSTATUS=${DIALSTATUS})
 same => n,Goto(from-livekit,800,1)
 same => n,Hangup()

; 702 -> latency test: rx/tx alag record karke LiveKit bhejo
exten => 702,1,NoOp(--> LATENCY TEST)
 same => n,Answer()
 same => n,Wait(1)
 same => n,MixMonitor(lat.wav,r(/var/spool/asterisk/monitor/lat-in.wav)t(/var/spool/asterisk/monitor/lat-out.wav))
 same => n,Dial(PJSIP/700@livekit,30)
 same => n,StopMixMonitor()
 same => n,Hangup()

; 1001 -> softphone ko wapas call
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()


[from-livekit]

; 800 -> transfer target. livekit-sip sends a SIP REFER here when the agent
; calls transfer_to_human(). This must come BEFORE the _. catch-all, which
; would otherwise match and hang up the transfer.
;
; Out over IAX2, because that is what the dialler runs. The REFER that got us
; here is SIP and could not have been anything else, but the leg it creates is
; ours to choose - see [globals].
;
; Deliberately NOT Answer()ed first. Answering makes Asterisk the far end, so
; the caller hears silence while the human's phone rings; dialling straight
; through passes real ringback instead.
exten => 800,1,NoOp(<-- TRANSFER landed: handing to a human)
 ; The caller's number, not the trunk's, so whoever picks up sees who is calling.
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,GotoIf($["${HANDOFF_EXTEN}" = ""]?nodest)
 same => n,Dial(${HANDOFF_PEER}/${HANDOFF_EXTEN},30)
 ; Reached only when nobody picked up, the peer was down, or the dial failed.
 ; DIALSTATUS is logged because "the transfer did not work" is otherwise
 ; indistinguishable from "the agent never transferred".
 same => n,NoOp(<-- TRANSFER FAILED: ${DIALSTATUS})
 same => n(nodest),Answer()
 same => n,Wait(1)
 same => n,Playback(demo-thanks)
 same => n,Hangup()

exten => _.,1,NoOp(<-- Inbound from LiveKit: ${EXTEN})
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Load test. Originated as Local/s@loadtest and bridged to 700, so the LiveKit
; side receives real speech and the full STT -> LLM -> TTS path runs. Silence
; would only exercise the transport and tell us nothing about capacity.
; ---------------------------------------------------------------------------
[loadtest]
exten => s,1,Answer()
 same => n,Set(i=0)
 same => n,Wait(2)
 same => n(loop),Playback(demo-thanks)
 same => n,Wait(7)
 same => n,Set(i=$[${i}+1])
 same => n,GotoIf($[${i} < ${IF($[${LOADTEST_TURNS}foo = foo]?8:${LOADTEST_TURNS})}]?loop)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Recording. Reached as Dial()'s b() pre-dial handler from 700, so it runs on
; the OUTBOUND channel to LiveKit, not the caller's. That is the point: this
; channel's SIP Call-ID is the one LiveKit hands the agent as sip.callID, so
; naming the file after it correlates the recording to the call row with nothing
; else to maintain. The caller's channel has a different Call-ID entirely.
;
; Once bridged, this channel's rx is the caller and tx is the agent, so a single
; MixMonitor captures both sides - including after a transfer to a human.
;
; ---------------------------------------------------------------------------
; Calls arriving from the production dialler. NOT CONFIGURED YET - the endpoint
; in pjsip.conf is still commented out pending their source IP.
;
; A separate context from `from-internal` on purpose, even though it does the
; same thing today. The dialler's traffic and the test softphone's should be
; distinguishable in the dialplan from the start: the moment they need different
; treatment - a different fallback extension, its own recording rule, a rate
; limit - having them share a context means working out which call was which
; after the fact, from the caller ID, which is exactly when it is least reliable.
;
; `include` rather than a copy, so the routing stays defined in one place.
; ---------------------------------------------------------------------------
[from-dialler]
include => from-internal

; ⚠️ THE CONTEXT BELOW MUST STAY LAST. A context header claims every extension
; that follows it, and putting this one after 700 silently swallowed 702 and
; 1001 - the same mistake that moved 702 into the wrong context once before.
; Anything new goes ABOVE this line.
; ---------------------------------------------------------------------------
[recsetup]
exten => s,1,NoOp(--> recording setup)
 ; ── dialler context onto the INVITE ────────────────────────────────────────
 ; This runs on the OUTBOUND PJSIP channel just before the INVITE is sent,
 ; which is the only point PJSIP_HEADER(add,...) has any effect. The values got
 ; here by inheritance from _7XX - see the underscore note there.
 ;
 ; ExecIf on each: an empty header is not the same as an absent one. X-Language
 ; arrives blank today, and adding `X-Language:` with nothing after it would put
 ; an empty string into the participant attributes, which reads as "the dialler
 ; said the language is ''" rather than "the dialler said nothing".
 ;
 ; Header names keep the dialler's own spelling (Modalname, Sr_id) rather than
 ; tidying them. A 1:1 mapping is worth more than tidiness when someone is
 ; comparing two consoles at 2am.
 same => n,ExecIf($["${X_CUS_NAME}" != ""]?Set(PJSIP_HEADER(add,X-Cus-Name)=${X_CUS_NAME}))
 same => n,ExecIf($["${X_CALLTYPE}" != ""]?Set(PJSIP_HEADER(add,X-Calltype)=${X_CALLTYPE}))
 same => n,ExecIf($["${X_SR_ID}" != ""]?Set(PJSIP_HEADER(add,X-Sr-Id)=${X_SR_ID}))
 same => n,ExecIf($["${X_LEAD_ID}" != ""]?Set(PJSIP_HEADER(add,X-Dialer-Lead-Id)=${X_LEAD_ID}))
 same => n,ExecIf($["${X_MODALNAME}" != ""]?Set(PJSIP_HEADER(add,X-Modalname)=${X_MODALNAME}))
 same => n,ExecIf($["${X_CALL_UNIQUE}" != ""]?Set(PJSIP_HEADER(add,X-Dialer-Call-Unique)=${X_CALL_UNIQUE}))
 same => n,ExecIf($["${X_LANGUAGE}" != ""]?Set(PJSIP_HEADER(add,X-Language)=${X_LANGUAGE}))
 ; ── recording ──────────────────────────────────────────────────────────────
 same => n,Set(CALLID=${FILTER(A-Za-z0-9\-_.,${CHANNEL(pjsip,call-id)})})
 ; Call-ID should be allocated by now; UNIQUEID is the safety net so a call is
 ; never left unrecorded. A fallback shows up in the log AND as a filename that
 ; matches no call row, so it cannot pass silently.
 same => n,ExecIf($["${CALLID}" = ""]?Set(CALLID=fallback-${UNIQUEID}))
 same => n,NoOp(--> recording id: ${CALLID})
 same => n,Set(RECBASE=/var/spool/asterisk/recordings/${CALLID})
 ; b = only record while bridged, so the file does not open with ringback.
 ; The third argument runs once the recording is closed.
 same => n,MixMonitor(${RECBASE}.wav,b,/usr/local/bin/rec-postprocess.sh ${RECBASE})
 same => n,Return()
