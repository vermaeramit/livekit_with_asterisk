[general]
static=yes
writeprotect=no

[from-internal]
; 600 -> Echo test: your own voice comes back (proves RTP both ways)
exten => 600,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 -> Simple playback (proves one-way RTP + codec)
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; 700 -> route the call into a LiveKit room via livekit-sip
exten => 700,1,NoOp(--> Routing to LiveKit AI)
 same => n,Set(CALLERID(num)=${CALLERID(num)})
 same => n,Dial(PJSIP/700@livekit,30)
 same => n,Hangup()

; 1001 -> dial the registered softphone back
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

; calls coming back from LiveKit (Phase 2 - outbound)
[from-livekit]
exten => _.,1,NoOp(<-- Inbound from LiveKit: ${EXTEN})
 same => n,Hangup()
