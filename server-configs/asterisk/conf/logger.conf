[general]
dateformat = %F %T

[logfiles]
; The stock messages.log carries no `verbose`, so dialplan NoOp() output - which
; is how the dialplan says what it is doing - never appears in it. Every attempt
; to debug a call ended with "the log shows nothing happened" when plenty had.
;
; A second file with verbose included, added by hand at the CLI, worked but did
; not survive a restart. This one does.
messages.log => notice,warning,error
debug.log    => notice,warning,error,verbose
