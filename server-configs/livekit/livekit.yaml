# Deployed at /opt/aivoice/livekit/livekit.yaml
# API keys are NOT here - they come from LIVEKIT_KEYS env, sourced from /opt/aivoice/.env

port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882          # single-port UDP mux - firewall friendly

  # CRITICAL: default is true, which STUN-discovers the host's public NAT address
  # and advertises it in ICE candidates. That address is unreachable from the
  # internal components - media would fail. Pin to the LAN address instead.
  use_external_ip: false
  node_ip: 10.130.9.243

redis:
  address: 127.0.0.1:6379

turn:
  enabled: false          # everything is on the LAN; no TURN needed

logging:
  level: info
  json: false
