services:
  # ⚠️ NOT IN USE. Asterisk runs natively - see server-configs/systemd/asterisk.service.
  #
  # It moved out of Docker because the team who operate the telephony side do not
  # work with containers, and a PBX nobody on call can debug is worse than one
  # built slightly differently. Kept here, stopped, as the rollback path:
  #
  #     systemctl stop asterisk && docker compose up -d asterisk
  #
  # That still works because network_mode is host either way, and the
  # aivoice_recordings volume has not been deleted. Do not start both: they bind
  # the same ports.
  asterisk:
    profiles: [ "rollback" ]
    build: ./asterisk
    container_name: asterisk
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./asterisk/conf:/conf-override:ro,Z
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
      # Recordings live in their own named volume rather than inside the spool,
      # so the admin panel can mount them read-only from its separate compose
      # project without being handed everything else Asterisk writes.
      - recordings:/var/spool/asterisk/recordings
    cap_add: [ SYS_NICE ]
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '1.5' }

  redis:
    image: redis:7.4-alpine
    container_name: redis
    network_mode: host
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro,Z
      # Without this the RDB snapshot lives in the container's writable layer,
      # so it survives a reboot but not a `compose up -d` that recreates the
      # container - and losing it silently deletes the SIP trunk again.
      - redis-data:/data
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 320M }

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: livekit
    network_mode: host
    restart: unless-stopped
    depends_on: [ redis ]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro,Z
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '2.0' }

  sip:
    image: livekit/sip:v1.8.0
    container_name: sip
    network_mode: host
    restart: unless-stopped
    depends_on: [ redis, livekit ]
    command: --config /etc/sip.yaml
    volumes:
      - ./sip/config.yaml:/etc/sip.yaml:ro,Z
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '1.0' }

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,Z
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

# Grafana lived here until the admin panel grew its own dashboard. Two places to
# maintain the same charts was one too many, and the panel's version is
# tenant-scoped - which Grafana never was.

volumes:
  # named explicitly so the admin panel's separate compose project can
  # reference it as an external volume
  recordings:
    name: aivoice_recordings
  pgdata:
  redis-data:
  asterisk-spool:
  asterisk-log:
