services:
  asterisk:
    build: ./asterisk
    container_name: asterisk
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./asterisk/conf:/conf-override:ro,Z
      - asterisk-spool:/var/spool/asterisk
      - asterisk-log:/var/log/asterisk
    cap_add: [ SYS_NICE ]
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '1.5' }

  redis:
    image: redis:7.4-alpine
    container_name: redis
    network_mode: host
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro,Z
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 320M }

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: livekit
    network_mode: host
    restart: unless-stopped
    depends_on: [ redis ]
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro,Z
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '2.0' }

  sip:
    image: livekit/sip:v1.8.0
    container_name: sip
    network_mode: host
    restart: unless-stopped
    depends_on: [ redis, livekit ]
    command: --config /etc/sip.yaml
    volumes:
      - ./sip/config.yaml:/etc/sip.yaml:ro,Z
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits: { cpus: '1.0' }

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,Z
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }


  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana
    restart: unless-stopped
    depends_on: [ postgres ]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }


volumes:
  grafana-data:
  pgdata:
  asterisk-spool:
  asterisk-log:
